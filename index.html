<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!--jabol:head:start-->
    <title>jabol</title>
    <meta name="description" content="A self-hosted link directory." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta property="og:title" content="jabol" />
    <meta property="og:description" content="A self-hosted link directory." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="jabol" />
    <meta name="twitter:description" content="A self-hosted link directory." />
    <!--jabol:head:end-->
    <script>
      // No-flash theme boot: runs before first paint.
      // Storage holds a *preference* (light|dark|mocha|latte|system|system-catppuccin);
      // we resolve system modes against prefers-color-scheme so first paint is correct.
      (function () {
        try {
          var pref = localStorage.getItem("jabol.theme") || "system-catppuccin";
          var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved =
            pref === "system" ? (dark ? "dark" : "light") :
            pref === "system-catppuccin" ? (dark ? "mocha" : "latte") :
            pref;
          document.documentElement.setAttribute("data-theme", resolved);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "mocha");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/client/main.tsx"></script>
  </body>
</html>
