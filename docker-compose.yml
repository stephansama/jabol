services:
  jabol:
    build: .
    image: jabol
    container_name: jabol
    ports:
      - "8080:8080"
    environment:
      JABOL_BASE_URL: http://localhost:8080
      JABOL_AUTH_SECRET: change-me-please
      # Optional: seed admin on first boot (no signup needed)
      # JABOL_ADMIN_EMAIL: you@example.com
      # JABOL_ADMIN_PASSWORD: change-me-too
    volumes:
      - ./links.json:/config/links.json
      - ./data:/data
    restart: unless-stopped
